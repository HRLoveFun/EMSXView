[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emsxview-platform-data"
version = "1.0.0"
description = "Cross-module data adapters and contracts for EMSXView"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "python-dateutil>=2.8",
    # 057 A10：数据管道包不在本仓依赖内（禁止 import DataPipeline.*）
    # 057 DL-16：外部算法白名单读取（xlsx 样板格式）
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["platform_data*"]
