# EMSXView Trading Platform - Docker Compose (Host Network Mode)
# Use on Linux when Bloomberg runs on the host machine.
# docker-compose -f docker-compose.host.yml up -d

version: "3.8"

services:

  backend:
    build:
      context: ..
      dockerfile: backend/api/Dockerfile
    image: emsxview-backend:latest
    container_name: emsxview-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - BLOOMBERG_HOST=localhost
      - BLOOMBERG_PORT=${BLOOMBERG_PORT:-8194}
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
      - ENABLE_AUDIT_LOG=true
    volumes:
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: emsxview-frontend:latest
    container_name: emsxview-frontend
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/nginx-host.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend
