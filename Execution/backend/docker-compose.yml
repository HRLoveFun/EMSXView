# EMSX Trading Platform - Docker Compose (Production)
# Single-command deployment: docker-compose up -d
# Prerequisites: Docker Desktop (Win/Mac) or Docker Engine (Linux)
# Copy .env.example to .env and edit before first run.

version: "3.8"

services:

  # ============================================================
  # Backend - FastAPI + Bloomberg EMSX
  # ============================================================
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: emsx-backend:latest
    container_name: emsx-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - BLOOMBERG_HOST=${BLOOMBERG_HOST:-host.docker.internal}
      - BLOOMBERG_PORT=${BLOOMBERG_PORT:-8194}
      - BLOOMBERG_TIMEOUT=${BLOOMBERG_TIMEOUT:-30000}
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - API_WORKERS=${API_WORKERS:-1}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-480}
      - ALLOWED_TRADERS=${ALLOWED_TRADERS:-}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-100}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1:80
      - ENABLE_REALTIME=${ENABLE_REALTIME:-true}
      - ENABLE_AUDIT_LOG=${ENABLE_AUDIT_LOG:-true}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://emsx:emsx@postgres:5432/emsx}
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-postgresql+psycopg://emsx:emsx@postgres:5432/emsx}

    expose:
      - "3000"

    volumes:
      - logs-data:/app/logs
      - /etc/localtime:/etc/localtime:ro

    networks:
      - emsx-network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    depends_on:
      postgres:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================
  # Postgres - durable execution persistence (Sprint 1)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: emsx-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_DB=${POSTGRES_DB:-emsx}
      - POSTGRES_USER=${POSTGRES_USER:-emsx}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-emsx}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    networks:
      - emsx-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emsx} -d ${POSTGRES_DB:-emsx}"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ============================================================
  # Frontend - React/Vite app built with Node, served via Nginx
  # Nginx also reverse-proxies /api/* and /ws/* to the backend
  # ============================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: emsx-frontend:latest
    container_name: emsx-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-80}:80"

    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro

    networks:
      - emsx-network

    depends_on:
      backend:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Redis - session cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: emsx-redis
    restart: unless-stopped

    volumes:
      - redis-data:/data

    networks:
      - emsx-network

    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ============================================================
  # Prometheus - metrics collection (optional)
  # Start with: docker-compose --profile monitoring up -d
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: emsx-prometheus
    restart: unless-stopped

    profiles:
      - monitoring

    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    networks:
      - emsx-network

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

  # ============================================================
  # Grafana - dashboards (optional, requires monitoring profile)
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: emsx-grafana
    restart: unless-stopped

    profiles:
      - monitoring

    ports:
      - "${GRAFANA_PORT:-3001}:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false

    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro

    networks:
      - emsx-network

    depends_on:
      - prometheus

networks:
  emsx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  logs-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

