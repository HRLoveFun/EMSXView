[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emsxview-costview"
version = "1.0.0"
description = "CostView TCA analysis and reporting domain"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    # pandas 是运行时硬依赖（src/tca_utils.py、src/query_cli.py、src/__main__.py、
    # src/monitoring/bdib_health.py 直接 import），此前一直由已删除的
    # CostView/requirements.txt 隐式提供；补此声明以保持全新环境可安装（python-dateutil
    # 由 pandas 传递依赖带入，无需独立声明）。
    "pandas>=2.0.0",
    # scipy 是评估层（026 阶段三）的统计检验 / 样本功效 / 成本回归依赖。DP-3-1 裁定引入：
    # 检验正确性不可妥协，不自行实现 t / KS / χ²；不引入 statsmodels —— 样本功效由
    # src/evaluation/power.py 以正态近似闭式公式自实现（仅复用 scipy 分位数）。
    # numpy 由 scipy / pandas 传递带入（既有代码 data_access/config.py 已在用）。
    "scipy>=1.11",
    "emsxview-platform-data",
    # 注：emsxview-datapipeline 已于 2026-09-16 移除——010-extract-pipeline 后管道
    # 迁至独立仓库 EMSXDataPipeline，CostView 为只读消费者且禁止 import
    # DataPipeline.*（AP-01），该声明在代码中无任何消费点；本模块数据访问一律经
    # 仓库内 data_access/ 与 platform_data/。
]

[tool.setuptools.packages.find]
where = [".."]
include = ["CostView*"]

# ── 测试与覆盖率（README §4.2「覆盖率未量化」整改）─────────────────────────
# 日常运行： pytest CostView/tests/
# 覆盖率：   pytest CostView/tests/ --cov=CostView/src --cov=CostView/api --cov-report=term-missing
# 门槛：先跑基线观测实际覆盖率，再在 CI 中启用 --cov-fail-under（建议 70）。
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["CostView/src", "CostView/api"]
omit = ["**/__pycache__/*"]

[tool.coverage.report]
show_missing = true
