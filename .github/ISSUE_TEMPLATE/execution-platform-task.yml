name: Execution Platform Task
description: Create an issue-sized task aligned to the EMSX Execution Platform WBS.
title: "[P?-S?-??] "
labels:
  - execution-platform
body:
  - type: markdown
    attributes:
      value: |
        Use this form for tasks tracked by `docs/EXECUTION_PLATFORM_WBS.md` and `.workbuddy/plans/execution-platform-status.yaml`.
  - type: input
    id: phase
    attributes:
      label: Phase ID
      description: Example: P0, P1, P2
      placeholder: P0
    validations:
      required: true
  - type: input
    id: sprint
    attributes:
      label: Sprint ID
      description: Example: P0-S0, P1-S1
      placeholder: P0-S0
    validations:
      required: true
  - type: input
    id: issue_id
    attributes:
      label: Issue ID
      description: Must match the machine-readable status ledger when applicable.
      placeholder: P0-S0-01
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the outcome of this issue-sized task.
      placeholder: Create the machine-readable sprint ledger and risk register.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List upstream issue IDs, files, or decisions required before work starts.
      placeholder: |
        - P0-S0-01
        - docs/EXECUTION_PLATFORM_WBS.md
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Planned file changes
      description: List full file paths with create/update/delete and purpose.
      placeholder: |
        - create: c:/Users/hrchen/Documents/EMSX/.workbuddy/plans/execution-platform-status.yaml — status ledger
        - update: c:/Users/hrchen/Documents/EMSX/.workbuddy/knowledge/metrics.md — add managed block
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Enumerate verifiable completion criteria.
      placeholder: |
        - Plan validation script passes
        - Managed metrics section updated
    validations:
      required: true
  - type: checkboxes
    id: checkpoints
    attributes:
      label: Required checkpoints
      options:
        - label: Code/build/test checkpoints defined
        - label: Dependency order confirmed
        - label: Rollback/compatibility impact reviewed
        - label: Ledger and WBS updates identified
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional implementation notes, blockers, or assumptions.
