name: execution-platform-autopilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: dry-run or apply'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      max_steps:
        description: 'Maximum issues to process per run'
        required: false
        default: '1'
        type: string
      allow_risky_gates:
        description: 'Allow auto-processing of manual-gate issues'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: read

concurrency:
  group: autopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autopilot-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run autopilot
        id: runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'dry-run' }}"
          MAX_STEPS="${{ github.event.inputs.max_steps || '1' }}"
          RISKY_FLAG=""
          if [ "${{ github.event.inputs.allow_risky_gates }}" = "true" ]; then
            RISKY_FLAG="--allow-risky-gates"
          fi
          python scripts/workflow/auto_runner.py \
            --mode "$MODE" \
            --max-steps "$MAX_STEPS" \
            $RISKY_FLAG \
            --log-level INFO \
            | tee autopilot-report.json
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-report
          path: autopilot-report.json
