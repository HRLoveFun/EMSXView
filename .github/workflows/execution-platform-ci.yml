name: execution-platform-ci

on:
  pull_request:
    paths:
      - '.github/**'
      - '.workbuddy/**'
      - 'docs/EXECUTION_PLATFORM_WBS.md'
      - 'docs/SPRINT_0_IMPLEMENTATION_CHECKLIST.md'
      - 'scripts/workflow/**'
      - 'ExecutionView/backend/**'
      - 'ExecutionView/frontend/**'
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - '.workbuddy/**'
      - 'docs/EXECUTION_PLATFORM_WBS.md'
      - 'docs/SPRINT_0_IMPLEMENTATION_CHECKLIST.md'
      - 'scripts/workflow/**'
      - 'ExecutionView/backend/**'
      - 'ExecutionView/frontend/**'

permissions:
  contents: read

jobs:
  validate-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate plan ledger and risk register
        run: python scripts/workflow/validate_phase_gate.py --mode plan

      - name: Generate status snapshot artifact
        run: python scripts/workflow/sync_execution_status.py --dry-run --output-json execution-platform-status.json

      - name: Upload status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: execution-platform-status
          path: execution-platform-status.json

  backend-syntax:
    needs: validate-plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile backend and workflow scripts
        run: python -m compileall ExecutionView/backend/api scripts/workflow

  frontend-check:
    needs: validate-plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ExecutionView/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ExecutionView/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (report-only)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
