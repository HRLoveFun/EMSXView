# 文档漂移周报 (2026-08-26)
#
# 每周一自动运行 scripts/audit_doc_drift.py 生成漂移报告:
#   - CORE 漂移（契约类）已在 boundary.yml CI 中硬阻断，此处仅汇总呈现
#   - WARN 漂移（非阻断类，如待实现适配器）依赖本报告暴露，避免无人跟踪
#
# 手动触发: Actions → doc-drift-report → Run workflow

name: doc-drift-report

on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 UTC 02:00（北京时间周一 10:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: 文档漂移周报
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行漂移审计
        continue-on-error: true # 报告任务不因退出码失败；结果进 Summary 与产物
        run: |
          python scripts/audit_doc_drift.py | tee drift-report.txt || true
      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo "## 📄 文档漂移周报 ($(date -u +%F))"
            echo ""
            echo '```'
            cat drift-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上传报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-drift-report
          path: drift-report.txt
          retention-days: 30
