name: execution-platform-progress

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  progress-snapshot:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate current plan state
        run: python scripts/workflow/validate_phase_gate.py --mode plan

      - name: Generate progress JSON
        run: python scripts/workflow/sync_execution_status.py --dry-run --output-json docs/generated/execution-platform-status.json

      - name: Generate handoff snapshot
        run: python scripts/workflow/generate_handoff_snapshot.py --output docs/generated/execution-platform-handoff.md

      - name: Autopilot dry-run (post-merge)
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        run: python scripts/workflow/auto_runner.py --mode dry-run --max-steps 1

      - name: Upload progress artifacts
        uses: actions/upload-artifact@v4
        with:
          name: execution-platform-progress
          path: |
            docs/generated/execution-platform-status.json
            docs/generated/execution-platform-handoff.md
