# 清理门禁报告 (2026-09-15)
#
# 目的：让 CL-xx（冗余代码）/ PF-xx（性能热点）规则**每天真的跑起来并可见** ——
# 此前 cleanup.py 仅在人工执行时运行（pre-commit 只跑 quality_gate --staged，
# 不含 cleanup 规则集），CL-12 等新增规则实际上不在日常门禁路径上。
#
# 当前模式：**建议性**（continue-on-error，结果进 Job Summary + 产物，不阻断 PR）。
#
# ── 为何暂不切 --strict（评估结论，2026-09-15）─────────────────────────────
#   1. `--strict` 的语义是「**基线外新增项**阻断」，而基线库
#      `scripts/reports/cleanup/cleanup.db` 被 .gitignore 排除（策略：基线历史不入库）
#      → CI 全新鲜克隆下基线为空，会把**全部存量项**（当前 PF 185 / CL 0）
#      判为「新增」，导致每个 PR 必然失败；
#   2. CL-02 / CL-05 / CL-06 / CL-09 / CL-12 为启发式规则，存在已知误报模式
#      （CL-12 首轮实测 14 项中即有 1 项误报：显式声明为 deprecated no-op 的兼容方法），
#      黑盒阻断会伤 PR 流畅度；skill 的规程要求「先跑一轮全量扫描并收口历史误报」后再切；
#   3. PF-xx 明确定位为「静态候选、需 profiler 实测」，不得阻断。
#
# ── 切换为阻断的条件（三条全满足再改）───────────────────────────────────
#   a. 连续若干轮本报告显示 CL 新增为 0 且无争议误报；
#   b. 误报一律经 `scripts/cleanup/config.py` 的豁免清单（随代码提交）收口，
#      **不依赖 `--suppress`**（其记录落在未入库的基线库里，CI 不可见）；
#   c. 把下方「全量扫描」步骤改为
#      `python scripts/cleanup.py --ruleset cl --strict --quiet`
#      并把 `continue-on-error` 置为 false（PF-xx 保持建议性、不参与阻断）。
#
# 手动触发: Actions → cleanup-report → Run workflow

name: cleanup-report

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master", "tca", "**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanup-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: 清理门禁报告 (CL-xx / PF-xx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 全量扫描（清理项 + 性能热点）
        continue-on-error: true # 建议性：结果进 Summary 与产物，不阻断
        run: |
          python scripts/cleanup.py --report --json | tee cleanup.json
      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo "## 🧹 清理门禁报告 ($(date -u +%F))"
            echo ""
            python scripts/cleanup/summary.py cleanup.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上传报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-report
          path: |
            cleanup.json
            scripts/reports/cleanup/report-*.md
          retention-days: 30
