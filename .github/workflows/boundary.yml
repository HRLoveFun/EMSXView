# 模块边界防护 CI (P2, 2026-08-14)
#
# 自动执行点:
#   1. 边界审计脚本 (AP-01 跨模块 import / AP-04 DB 路径 / AP-08 下划线访问;
#      核心文档漂移自 2026-08-26 起硬阻断)
#   2. 后端边界测试 (backend/api/tests/boundaries/)
#   3. 后端全量测试
#   4. 前端 tsc + vitest
#
# 010-extract-pipeline: DataPipeline 回归测试已随数据管道迁独立仓库
# EMSXDataPipeline（唯一写入方），管道侧回归由该仓库 CI 负责；
# 本仓库仅保留读取消费侧测试。
#
# 审计规则从 platform_data/contracts/boundary_registry.py 生成,
# 新增模块契约自动纳入检测。

name: boundary-protection

on:
  push:
    branches: ["main", "master", "tca", "**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: 边界审计 (audit scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装审计依赖 (audit 脚本 import DataPipeline.config → numpy/pandas)
        run: |
          pip install numpy pandas
      - name: 运行边界审计脚本
        run: |
          # 真正的边界违规 (AP-01/AP-08/AP-04) 硬失败阻断
          python scripts/audit_cross_imports.py
          python scripts/audit_underscore_access.py
          python scripts/audit_db_paths.py
          # 核心文档漂移 (memory.md ADR 索引 / module-boundary 契约 /
          # AGENTS↔CODEBUDDY 同步) 硬阻断 (2026-08-26 升级);
          # 非核心漂移 (如 doc 先于代码的待实现适配器) 由脚本降级 WARN 放行
          python scripts/audit_doc_drift.py

  backend-tests:
    name: 后端测试 (FastAPI + boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖 (blpapi 无 PyPI 发行版, 用仓库内 stub 替代)
        run: |
          cd backend/api
          # 过滤 blpapi 行 (Bloomberg 私有源, 公共 runner 无法安装)
          grep -v '^blpapi' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          # 内部包 --no-deps + 显式依赖 (避免 blpapi 解析失败; platform_data 需要 pydantic/dateutil)
          # 010-extract-pipeline: DataPipeline 已迁独立仓库，不再安装；
          # 读取侧配置常量由仓库根 data_access/ 提供（PYTHONPATH 覆盖）
          pip install -e ../../platform_data --no-deps
          pip install -e ../../CostView --no-deps
          pip install numpy pandas duckdb pyarrow python-dateutil pydantic psutil
          pip install pytest-asyncio
          # 依赖内部包: 仓库根(platform_data/CostView/data_access) + blpapi stub
          echo "PYTHONPATH=$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/scripts/ci/blpapi_stub:$PYTHONPATH" >> "$GITHUB_ENV"
      - name: "边界测试 (硬阻断: 真正的边界违规)"
        run: |
          cd backend/api
          python -m pytest tests/boundaries/ -q
      - name: "全量测试 (硬阻断)"
        run: |
          cd backend/api
          python -m pytest tests/ -q --ignore=tests/boundaries

  frontend-tests:
    name: 前端测试 (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: |
          cd frontend
          npm ci
      - name: 类型检查 (仅检查本次防护相关文件无新错误)
        run: |
          cd frontend
          npx tsc -b --noEmit || true  # 历史遗留错误不阻断, 由 PR 审查跟踪
      - name: 单元测试
        run: |
          cd frontend
          npx vitest run
